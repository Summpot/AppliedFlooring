name: Build and Release Mod

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Minecraft Mod Jars
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Collect Mod Artifacts
        run: |
          mkdir -p artifacts
          find */build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-dev-shadow.jar" -exec cp -v {} artifacts/ \;

      - name: Upload Mod Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appliedflooring-jars
          path: artifacts/*.jar
          retention-days: 30

      - name: Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
          generate_release_notes: true
