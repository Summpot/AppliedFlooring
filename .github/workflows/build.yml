name: Mod

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish-mod:
        description: 'Publish mod jars to Modrinth and CurseForge'
        required: false
        type: boolean
        default: false
      release-tag:
        description: 'Release tag to publish as a stable mod version'
        required: false
        type: string
        default: ''

jobs:
  build-mod:
    name: Build Minecraft Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mod with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Collect mod artifacts
        run: |
          mkdir -p mod-artifacts
          projects=(
            fabric-1.19.2
            forge-1.19.2
            fabric-1.20.1
            forge-1.20.1
            neoforge-1.21.1
          )

          for p in "${projects[@]}"; do
            dir="${p}/build/libs"
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 1 -type f -name "appliedflooring-${p}-*.jar" \
                ! -name "*-dev-shadow.jar" \
                -exec cp -v "{}" mod-artifacts/ \;
            fi
          done

          echo "Collected mod artifacts:"
          ls -la mod-artifacts

      - name: Upload mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appliedflooring-mod
          path: mod-artifacts/*.jar
          retention-days: 30

      - name: Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mod-artifacts/*.jar
          generate_release_notes: true

  publish-mod:
    name: Publish Mod (${{ matrix.loader-label }} ${{ matrix.minecraft-version }})
    needs: build-mod
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish-mod))
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact-id: fabric-1.19.2
            loader: fabric
            loader-label: Fabric
            minecraft-version: '1.19.2'
            java-version: '17'
            version-suffix: f1192
          - artifact-id: forge-1.19.2
            loader: forge
            loader-label: Forge
            minecraft-version: '1.19.2'
            java-version: '17'
            version-suffix: fg1192
          - artifact-id: fabric-1.20.1
            loader: fabric
            loader-label: Fabric
            minecraft-version: '1.20.1'
            java-version: '21'
            version-suffix: f1201
          - artifact-id: forge-1.20.1
            loader: forge
            loader-label: Forge
            minecraft-version: '1.20.1'
            java-version: '21'
            version-suffix: fg1201
          - artifact-id: neoforge-1.21.1
            loader: neoforge
            loader-label: NeoForge
            minecraft-version: '1.21.1'
            java-version: '21'
            version-suffix: nf1211

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download mod artifacts
        uses: actions/download-artifact@v4
        with:
          name: appliedflooring-mod
          path: mod-artifacts

      - name: Prepare publish metadata
        id: publish
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release-tag || '' }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID || secrets.MODRINTH_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID || secrets.CURSEFORGE_PROJECT_ID }}
        run: |
          set -euo pipefail

          missing=0
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::Missing MODRINTH_TOKEN secret."
            missing=1
          fi
          if [ -z "$MODRINTH_PROJECT_ID" ]; then
            echo "::error::Missing MODRINTH_PROJECT_ID repository variable or secret."
            missing=1
          fi
          if [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "::error::Missing CURSEFORGE_TOKEN secret."
            missing=1
          fi
          if [ -z "$CURSEFORGE_PROJECT_ID" ]; then
            echo "::error::Missing CURSEFORGE_PROJECT_ID repository variable or secret."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          release_tag="$RELEASE_TAG_INPUT"
          if [ -z "$release_tag" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          fi

          mod_version="$(awk -F= '$1 ~ /^[[:space:]]*mod_version[[:space:]]*$/ { gsub(/[[:space:]]/, "", $2); print $2 }' gradle.properties)"
          if [ -z "$mod_version" ]; then
            echo "::error::Unable to read mod_version from gradle.properties."
            exit 1
          fi

          short_sha="${GITHUB_SHA::7}"
          version_suffix="${{ matrix.version-suffix }}"

          if [ -n "$release_tag" ]; then
            base_version="${release_tag#v}"
            version_type="release"
            version="${base_version}-${version_suffix}"
            name="Applied Flooring ${base_version} (${{ matrix.loader-label }} ${{ matrix.minecraft-version }})"
            changelog="Automated release build from ${release_tag}."
          else
            base_version="$mod_version"
            version_type="beta"
            version="${base_version}-p${GITHUB_RUN_NUMBER}-${short_sha}-${version_suffix}"
            name="Applied Flooring ${base_version} preview ${GITHUB_RUN_NUMBER} (${{ matrix.loader-label }} ${{ matrix.minecraft-version }})"
            changelog="Automated preview build from ${GITHUB_SHA}."
          fi

          file_count="$(find mod-artifacts -maxdepth 1 -type f -name "appliedflooring-${{ matrix.artifact-id }}-*.jar" ! -name "*-sources.jar" | wc -l | tr -d ' ')"
          if [ "$file_count" != "1" ]; then
            echo "::error::Expected exactly one publishable jar for ${{ matrix.artifact-id }}, found ${file_count}."
            find mod-artifacts -maxdepth 1 -type f -name "appliedflooring-${{ matrix.artifact-id }}-*.jar" -print
            exit 1
          fi
          publish_file="$(find mod-artifacts -maxdepth 1 -type f -name "appliedflooring-${{ matrix.artifact-id }}-*.jar" ! -name "*-sources.jar" -print -quit)"

          echo "version-type=${version_type}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "changelog=${changelog}" >> "$GITHUB_OUTPUT"
          echo "file=${publish_file}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish to Modrinth
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID || secrets.MODRINTH_PROJECT_ID }}
          PUBLISH_FILE: ${{ steps.publish.outputs.file }}
          PUBLISH_NAME: ${{ steps.publish.outputs.name }}
          PUBLISH_VERSION: ${{ steps.publish.outputs.version }}
          PUBLISH_VERSION_TYPE: ${{ steps.publish.outputs.version-type }}
          PUBLISH_CHANGELOG: ${{ steps.publish.outputs.changelog }}
          MOD_LOADER: ${{ matrix.loader }}
          MINECRAFT_VERSION: ${{ matrix.minecraft-version }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const data = {
            name: process.env.PUBLISH_NAME,
            version_number: process.env.PUBLISH_VERSION,
            changelog: process.env.PUBLISH_CHANGELOG,
            dependencies: [
              {
                project_id: "applied-energistics-2",
                dependency_type: "required"
              }
            ],
            game_versions: [process.env.MINECRAFT_VERSION],
            version_type: process.env.PUBLISH_VERSION_TYPE,
            loaders: [process.env.MOD_LOADER],
            featured: process.env.PUBLISH_VERSION_TYPE === "release",
            status: "listed",
            project_id: process.env.MODRINTH_PROJECT_ID,
            file_parts: ["file"],
            primary_file: "file",
          };

          fs.writeFileSync("modrinth-data.json", JSON.stringify(data));
          NODE

          node <<'NODE'
          const fs = require("node:fs");

          async function main() {
            const form = new FormData();
            form.append("data", fs.readFileSync("modrinth-data.json", "utf8"));
            form.append("file", new Blob([fs.readFileSync(process.env.PUBLISH_FILE)], { type: "application/java-archive" }), process.env.PUBLISH_FILE.split("/").pop());

            const response = await fetch("https://api.modrinth.com/v2/version", {
              method: "POST",
              headers: {
                "Authorization": process.env.MODRINTH_TOKEN,
                "User-Agent": `Summpot/AppliedFlooring/${process.env.GITHUB_RUN_ID} (https://github.com/${process.env.GITHUB_REPOSITORY})`,
              },
              body: form,
            });

            const body = await response.text();
            if (!response.ok) {
              throw new Error(`Modrinth upload failed with ${response.status}: ${body}.`);
            }
            console.log(body);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish to CurseForge
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID || secrets.CURSEFORGE_PROJECT_ID }}
          PUBLISH_FILE: ${{ steps.publish.outputs.file }}
          PUBLISH_NAME: ${{ steps.publish.outputs.name }}
          PUBLISH_VERSION_TYPE: ${{ steps.publish.outputs.version-type }}
          PUBLISH_CHANGELOG: ${{ steps.publish.outputs.changelog }}
          CURSEFORGE_LOADER: ${{ matrix.loader-label }}
          MINECRAFT_VERSION: ${{ matrix.minecraft-version }}
          JAVA_VERSION: ${{ matrix.java-version }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const baseUrl = "https://minecraft.curseforge.com/api";
          const token = process.env.CURSEFORGE_TOKEN;
          const normalize = (value) => String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, "");

          async function main() {
            async function getJson(path) {
              const response = await fetch(`${baseUrl}${path}`, {
                headers: {
                  "Accept": "application/json",
                  "X-Api-Token": token,
                },
              });
              if (!response.ok) {
                throw new Error(`CurseForge ${path} failed with ${response.status}: ${await response.text()}`);
              }
              return await response.json();
            }

            const versions = await getJson("/game/versions?cache=true");
            const versionTypes = await getJson("/game/version-types?cache=true");
            const minecraftVersionTypeIdOverrides = new Map([
              ["1.21.1", 77784],
            ]);

            function gameVersionTypeId(entry) {
              return entry.gameVersionTypeID ?? entry.gameVersionTypeId;
            }

            function describeVersion(entry) {
              return `${entry.name}#${entry.id}/type:${gameVersionTypeId(entry) ?? "unknown"}`;
            }

            function findVersionTypeId(...names) {
              const wanted = new Set(names.map(normalize));
              const match = versionTypes.find((entry) => {
                const name = normalize(entry.name);
                const slug = normalize(entry.slug);
                return wanted.has(name) || wanted.has(slug);
              });
              return match?.id ?? null;
            }

            function findRequiredVersion(name, label, versionTypeId) {
              const normalizedName = normalize(name);
              const candidates = versions.filter((entry) => normalize(entry.name) === normalizedName);
              const version = versionTypeId
                ? candidates.find((entry) => gameVersionTypeId(entry) === versionTypeId)
                : candidates[0];
              if (!version) {
                throw new Error(`Unable to resolve CurseForge game version ID for "${name}" in ${label}${versionTypeId ? ` (type ${versionTypeId})` : ""}. Matching names: ${candidates.map(describeVersion).join(", ") || "(none)"}`);
              }
              return version;
            }

            function findEnvironmentVersions() {
              const environmentTypeId = findVersionTypeId("environment", "environments");
              const pool = environmentTypeId != null
                ? versions.filter((entry) => gameVersionTypeId(entry) === environmentTypeId)
                : versions;

              const byName = (name) => pool.find((entry) => normalize(entry.name) === normalize(name));
              const client = byName("Client");
              const server = byName("Server");
              const both = byName("Client and Server") || byName("Client & Server");

              const selected = [];
              if (client) selected.push(client);
              if (server) selected.push(server);
              if (selected.length === 0 && both) selected.push(both);

              if (selected.length === 0) {
                const sample = pool.slice(0, 20).map(describeVersion).join(", ") || "(none)";
                throw new Error(`Unable to resolve CurseForge environment versions. Sample: ${sample}`);
              }
              return selected;
            }

            const minecraftVersionTypeId = minecraftVersionTypeIdOverrides.get(process.env.MINECRAFT_VERSION);
            const minecraftVersion = findRequiredVersion(process.env.MINECRAFT_VERSION, "Minecraft versions", minecraftVersionTypeId);
            const loaderVersion = findRequiredVersion(process.env.CURSEFORGE_LOADER, `${process.env.CURSEFORGE_LOADER} loader versions`);
            const javaVersionName = `java${process.env.JAVA_VERSION || "21"}`;
            const javaVersion = versions.find((entry) => normalize(entry.name) === javaVersionName);
            const environmentVersions = findEnvironmentVersions();

            const gameVersions = [minecraftVersion.id, loaderVersion.id];
            if (javaVersion) {
              gameVersions.push(javaVersion.id);
            }
            for (const environmentVersion of environmentVersions) {
              gameVersions.push(environmentVersion.id);
            }

            const metadata = {
              changelog: process.env.PUBLISH_CHANGELOG,
              changelogType: "markdown",
              displayName: process.env.PUBLISH_NAME,
              gameVersions: [...new Set(gameVersions)],
              releaseType: process.env.PUBLISH_VERSION_TYPE,
              relations: {
                projects: [
                  {
                    slug: "applied-energistics-2",
                    type: "requiredDependency"
                  }
                ]
              }
            };

            fs.writeFileSync("curseforge-metadata.json", JSON.stringify(metadata));
            console.log(
              `Resolved CurseForge game versions: Minecraft ${describeVersion(minecraftVersion)}, ` +
              `loader ${describeVersion(loaderVersion)}` +
              `${javaVersion ? `, Java ${describeVersion(javaVersion)}` : ""}, ` +
              `environment ${environmentVersions.map(describeVersion).join(" + ")}`
            );
            console.log(`Resolved CurseForge game version IDs: ${metadata.gameVersions.join(", ")}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          node <<'NODE'
          const fs = require("node:fs");

          async function main() {
            const form = new FormData();
            form.append("metadata", fs.readFileSync("curseforge-metadata.json", "utf8"));
            form.append("file", new Blob([fs.readFileSync(process.env.PUBLISH_FILE)], { type: "application/java-archive" }), process.env.PUBLISH_FILE.split("/").pop());

            const response = await fetch(`https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_PROJECT_ID}/upload-file`, {
              method: "POST",
              headers: {
                "X-Api-Token": process.env.CURSEFORGE_TOKEN,
              },
              body: form,
            });

            const body = await response.text();
            if (!response.ok) {
              throw new Error(`CurseForge upload failed with ${response.status}: ${body}.`);
            }
            console.log(body);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
